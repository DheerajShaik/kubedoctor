apiVersion: v1
kind: ServiceAccount
metadata:
  name: incomplete-reader
  namespace: doctor-incident
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incomplete-reader
  namespace: doctor-incident
rules:
  - apiGroups: [""]
    resources: [pods, services, persistentvolumeclaims, endpoints, resourcequotas, limitranges]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, replicasets, statefulsets]
    verbs: [list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [list]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incomplete-reader
  namespace: doctor-incident
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: incomplete-reader
subjects:
  - kind: ServiceAccount
    name: incomplete-reader
    namespace: doctor-incident
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubedoctor-lab-dependencies
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [doctor-incident, kube-system]
    verbs: [get]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubedoctor-lab-incomplete-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubedoctor-lab-dependencies
subjects:
  - kind: ServiceAccount
    name: incomplete-reader
    namespace: doctor-incident
