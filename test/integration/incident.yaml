apiVersion: v1
kind: Namespace
metadata:
  name: doctor-incident
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-engine-config
  namespace: doctor-incident
  annotations:
    kubedoctor.test/fixture-marker: KUBEDOCTOR_INTEGRATION_CREDENTIAL_SENTINEL
data:
  Corefile: |
    .:1053 {
      errors
      health :8080
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: doctor-incident
spec:
  replicas: 1
  progressDeadlineSeconds: 20
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: app
          image: __COREDNS_IMAGE__
          imagePullPolicy: Never
          args: ['-conf', '/etc/coredns/Corefile']
          env:
            - name: FIXTURE_LITERAL
              value: KUBEDOCTOR_INTEGRATION_CREDENTIAL_SENTINEL
            - name: CHECKOUT_REQUIRED
              valueFrom:
                configMapKeyRef:
                  name: checkout-dependency
                  key: token
          ports:
            - name: health
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: health
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
          resources:
            requests: {cpu: 20m, memory: 30Mi}
            limits: {cpu: 100m, memory: 100Mi}
      volumes:
        - name: config
          configMap:
            name: checkout-engine-config
            items:
              - key: Corefile
                path: Corefile
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: doctor-incident
spec:
  selector:
    app: checkout
  ports:
    - name: health
      port: 80
      targetPort: health
