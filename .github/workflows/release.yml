name: Draft release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  draft:
    if: github.repository == 'DheerajShaik/kubedoctor'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Verify release revision and build assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          scripts/release.sh "$RELEASE_TAG"
          (cd dist && sha256sum -c SHA256SUMS)
          archive="dist/kubectl-doctor-${RELEASE_TAG}-linux-amd64.tar.gz"
          tar -xOf "$archive" kubectl-doctor > "$RUNNER_TEMP/kubectl-doctor"
          chmod 700 "$RUNNER_TEMP/kubectl-doctor"
          test "$("$RUNNER_TEMP/kubectl-doctor" version)" = "kubectl-doctor $RELEASE_TAG ($(git rev-parse HEAD))"
      - name: Create unpublished draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --title "KubeDoctor $RELEASE_TAG" --notes-file CHANGELOG.md dist/*
