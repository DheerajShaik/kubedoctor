name: Draft release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  draft:
    if: github.repository == 'DheerajShaik/kubedoctor'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Verify release revision and build assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          scripts/release.sh "$RELEASE_TAG"
          (cd dist && sha256sum -c SHA256SUMS)
          archive="dist/kubectl-doctor-${RELEASE_TAG}-linux-amd64.tar.gz"
          tar -xOf "$archive" kubectl-doctor > "$RUNNER_TEMP/kubectl-doctor"
          chmod 700 "$RUNNER_TEMP/kubectl-doctor"
          test "$("$RUNNER_TEMP/kubectl-doctor" version)" = "kubectl-doctor $RELEASE_TAG ($(git rev-parse HEAD))"
      - name: Create unpublished draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="$RUNNER_TEMP/kubedoctor-release-notes.md"
          release_commit=$(git rev-parse HEAD)
          {
            awk -v release="$RELEASE_TAG" '$0 == "## " release {show=1; next} /^## / && show {exit} show' CHANGELOG.md
            printf '\nBuilt from [commit %s](https://github.com/%s/commit/%s).\n' "$release_commit" "$GITHUB_REPOSITORY" "$release_commit"
            printf '\n[Installation and offline example](https://github.com/%s/blob/%s/docs/releases/%s/MIGRATION.md) · [Compatibility matrix](https://github.com/%s/blob/%s/docs/releases/%s/LAB.md) · [Verification](https://github.com/%s/blob/%s/docs/releases/%s/VALIDATION.md)\n' \
              "$GITHUB_REPOSITORY" "$release_commit" "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$release_commit" "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$release_commit" "$RELEASE_TAG"
            printf '\n### SHA-256\n\n```text\n'
            cat dist/SHA256SUMS
            printf '```\n'
          } > "$notes"
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "KubeDoctor $RELEASE_TAG" --notes-file "$notes" dist/*
