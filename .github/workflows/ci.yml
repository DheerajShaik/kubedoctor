name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  go-checks:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.4'
      - name: Record pull request base protection
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.base_ref }}
        run: |
          if protection=$(gh api "repos/$GITHUB_REPOSITORY/branches/$BASE" --jq '.protected'); then
            printf 'Base branch protected: %s\n' "$protection"
          else
            printf 'Base branch protection metadata unavailable.\n'
          fi
      - name: Go formatting
        shell: bash
        run: |
          unformatted="$(git ls-files -z -- '*.go' | xargs -0r gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - run: go mod verify
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...

  bundle-fuzz:
    name: Bounded bundle parser fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Exercise the parser fuzz target
        shell: bash
        run: |
          go test ./internal/bundle -list '^FuzzDecode$' | grep -Fx FuzzDecode
          go test ./internal/bundle -run='^$' -fuzz='^FuzzDecode$' -fuzztime=20s -parallel=2

  history:
    name: Historical metrics on real Prometheus
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: ./scripts/history-integration.sh

  offline-browser:
    name: Offline report browser and printing
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Test generated reports in the runner browser
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/kubedoctor-browser-venv"
          "$RUNNER_TEMP/kubedoctor-browser-venv/bin/python" -m pip install playwright==1.62.0
          chromium=$(command -v google-chrome)
          "$chromium" --version
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          mkdir -p "$RUNNER_TEMP/browser"
          KUBEDOCTOR_HTML_TEST_OUTPUT="$RUNNER_TEMP/browser" go test -count=1 \
            -run '^TestRenderedReportAndBrowserFixture$' ./internal/htmlreport
          "$RUNNER_TEMP/kubedoctor-browser-venv/bin/python" test/browser/offline.py "$RUNNER_TEMP/browser/browser.html" \
            --comparison docs/releases/v0.2.0/examples/comparison.html --chromium "$chromium" \
            --output "$RUNNER_TEMP/browser"

  vulnerabilities:
    name: Go vulnerability check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.4'
      - name: Scan reachable Go vulnerabilities
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kubedoctor-tools"
          GOBIN="$RUNNER_TEMP/kubedoctor-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          "$RUNNER_TEMP/kubedoctor-tools/govulncheck" ./...

  builds:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.4'
      - name: Cross-compile kubectl-doctor
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          binary="$RUNNER_TEMP/kubectl-doctor"
          if [[ "$GOOS" == windows ]]; then
            binary="$binary.exe"
          fi
          go build -trimpath -o "$binary" ./cmd/kubectl-doctor
          test -s "$binary"

  integration:
    name: ${{ matrix.job }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: '1.35.8'
            variant: default
            job: Kubernetes 1.35.8 integration
          - kubernetes: '1.36.4'
            variant: nodelocal
            job: Kubernetes 1.36.4 integration
          - kubernetes: '1.36.4'
            variant: cilium
            job: Kubernetes 1.36.4 Cilium integration
    env:
      KUBERNETES_VERSION: ${{ matrix.kubernetes }}
      LAB_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.4'
      - name: Install pinned lab tools
        shell: bash
        run: |
          tool_variant=default
          if [[ "$LAB_VARIANT" == cilium ]]; then
            tool_variant=cilium
          fi
          ./scripts/integration-tools.sh "$KUBERNETES_VERSION" "$RUNNER_TEMP/kubedoctor-tools" "$tool_variant"
          printf '%s\n' "$RUNNER_TEMP/kubedoctor-tools" >> "$GITHUB_PATH"
      - name: Exercise the connected workflow against a disposable cluster
        shell: bash
        run: |
          KUBEDOCTOR_EXAMPLE_DIR="$RUNNER_TEMP/kubedoctor-examples" \
            ./scripts/integration.sh "$KUBERNETES_VERSION" "$LAB_VARIANT"
      - name: Store the verified synthetic incident artifacts
        if: matrix.variant == 'nodelocal'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: verified-synthetic-incident
          path: ${{ runner.temp }}/kubedoctor-examples
          if-no-files-found: error
          retention-days: 7
